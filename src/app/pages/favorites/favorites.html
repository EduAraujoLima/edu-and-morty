<h1 class="font-creepster creepster-title text-4xl my-4 ml-1">{{ 'app.favorites' | translate }}</h1>
<ng-container *appIfLoading>
  <ng-template
    [appEmpty]="$favorites()"
    [appEmptyCustomTemplate]="backButton"
    [title]="'app.favoritesEmptyTitle' | translate"
    [subtitle]="'app.favoritesEmptySubtitle' | translate"
  >
    <mat-grid-list [cols]="cols$ | async" gutterSize="32" rowHeight="1:1">
      @for (char of $favorites(); track $index) {
        <mat-grid-tile>
          <app-character-card
            [character]="char"
            (removeFromFavorites)="removeFavoriteCharacter($event)"
          />
        </mat-grid-tile>
      }
    </mat-grid-list>
  </ng-template>
</ng-container>

<ng-template #backButton>
  <a mat-button color="primary" routerLink="/characters">{{ 'app.back' | translate }}</a>
</ng-template>
