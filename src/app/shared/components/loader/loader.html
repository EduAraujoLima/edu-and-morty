<div class="portal-loader" aria-live="polite" aria-busy="true" role="status">
  <svg
    class="portal"
    viewBox="0 0 120 120"
    xmlns="http://www.w3.org/2000/svg"
    focusable="false"
    aria-hidden="true"
  >
    <defs>
      <!-- Núcleo com múltiplos tons de verde do portal da série -->
      <radialGradient id="gCore" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#fdffdb" />
        <stop offset="22%" stop-color="#cdfb6f" />
        <stop offset="48%" stop-color="#86f136" />
        <stop offset="70%" stop-color="#46d726" />
        <stop offset="100%" stop-color="#127a19" />
      </radialGradient>

      <!-- Brilho amarelado nas bordas -->
      <linearGradient id="gRing" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff7a6" />
        <stop offset="50%" stop-color="#b3ff54" />
        <stop offset="100%" stop-color="#47f4b1" />
      </linearGradient>

      <!-- Efeito "gosma" com ruido animado e deslocamento -->
      <filter id="fGoo" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.65 0.85"
          numOctaves="2"
          seed="4"
          result="noise"
        >
          <animate attributeName="baseFrequency" values="0.55 0.75;0.7 0.95;0.55 0.75" dur="6s" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G">
          <animate attributeName="scale" values="7;11;7" dur="3.8s" repeatCount="indefinite" />
        </feDisplacementMap>
      </filter>

      <!-- Halo de brilho difuso -->
      <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <g class="spin">
      <!-- Núcleo multi-camadas com efeito de gosma para parecer orgânico -->
      <g class="core" filter="url(#fGoo)">
        <circle class="blob b1" cx="60" cy="60" r="34" fill="url(#gCore)" />
        <circle class="blob b2" cx="60" cy="60" r="40" fill="url(#gCore)" opacity="0.9" />
        <circle class="blob b3" cx="60" cy="60" r="46" fill="url(#gCore)" opacity="0.7" />
      </g>

      <!-- Anéis brilhantes que lembram os contornos do portal -->
      <g class="rings" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#fGlow)">
        <circle class="ring ring--1" cx="60" cy="60" r="48" stroke="url(#gRing)" stroke-width="6" stroke-dasharray="42 16" stroke-dashoffset="0" />
        <circle class="ring ring--2" cx="60" cy="60" r="56" stroke="url(#gRing)" stroke-width="4" stroke-dasharray="24 18" stroke-dashoffset="0" opacity="0.95" />
        <circle class="ring ring--3" cx="60" cy="60" r="36" stroke="url(#gRing)" stroke-width="4" stroke-dasharray="18 10" stroke-dashoffset="0" opacity="0.85" />
      </g>

      <!-- Traços e partículas com brilho amarelado -->
      <g class="sparks" stroke="#fff79a" stroke-width="2" fill="none" opacity="0.9">
        <path class="spark" d="M64 12 Q78 24 92 38" />
        <path class="spark" d="M28 26 Q44 44 60 58" />
        <path class="spark" d="M16 64 Q48 60 80 64" />
      </g>

      <!-- Pontos orbitando para dar vida -->
      <g class="orbits" fill="#fffde6" opacity="0.9">
        <g transform="translate(60 60)">
          <g>
            <circle class="spark" cx="0" cy="-52" r="1.6" />
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.6s" repeatCount="indefinite" />
          </g>
          <g>
            <circle class="spark" cx="0" cy="-44" r="1.2" />
            <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="2.8s" repeatCount="indefinite" />
          </g>
          <g>
            <circle class="spark" cx="0" cy="-36" r="1.4" />
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite" />
          </g>
        </g>
      </g>
    </g>
  </svg>
  <span class="sr-only">Carregando…</span>
</div>
