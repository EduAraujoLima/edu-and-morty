<div class="flex min-h-[240px] sm:min-h-[320px] items-center justify-center">
  <div class="mx-auto max-w-2xl">
    <h2 class="text-xl sm:text-2xl font-extrabold text-white">
      {{ title() || 'app.emptyTitle' | translate }}
    </h2>
    <p class="mt-3 text-sm sm:text-base text-neutral-300">
      {{ subtitle() || 'app.emptySubtitle' | translate }}
    </p>

    <div class="mt-6">
      @if (customTemplate()) {
        <ng-container [ngTemplateOutlet]="customTemplate()"></ng-container>
      }
    </div>
  </div>
</div>
